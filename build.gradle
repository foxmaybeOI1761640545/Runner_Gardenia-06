apply plugin: 'com.android.application'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Explicit release versions are independent of Git history and shallow clones.
def releaseVersion = new Properties()
file('version.properties').withInputStream { releaseVersion.load(it) }
def gitDescription = { ->
    if (releaseVersion.VERSION_NAME_FULL) return releaseVersion.VERSION_NAME_FULL
    def description = providers.exec {
        commandLine 'git', 'describe', '--tags', '--always'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()

    return description ?: releaseVersion.VERSION_NAME
}
// Environment variables are used by Actions. Preserve legacy local -D options.
def signingValue = { String environmentName, String systemName ->
    System.getenv(environmentName) ?: System.getProperty(systemName)
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdk = 37

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    defaultConfig {
        applicationId 'com.fox.runner'
        versionCode releaseVersion.VERSION_CODE.toInteger()
        versionName releaseVersion.VERSION_NAME

        buildConfigField "String", "VERSION_NAME_FULL", "\"${gitDescription()}\""

        minSdk = 26
        targetSdk = 37

        testInstrumentationRunner 'de.dennisguse.opentracks.TestRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    testOptions {
        managedDevices {
            localDevices {
                mediumPhone {
                    device = "Medium Phone"
                    apiLevel = 35
                    systemImageSource = "aosp"
                }
            }
        }
    }
    signingConfigs {
        nightly {
            if (System.getProperty('nightly_store_file') != null) {
                storeFile file(System.getProperty('nightly_store_file'))
                storePassword System.getProperty('nightly_store_password')
                keyAlias System.getProperty('nightly_key_alias')
                keyPassword System.getProperty('nightly_key_password')
            }
        }
        release {
            def releaseStore = signingValue('ANDROID_KEYSTORE_FILE', 'release_store_file')
            if (releaseStore != null) {
                storeFile file(releaseStore)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'release_store_password')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'release_key_alias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'release_key_password')
            }
        }
    }

    namespace = 'de.dennisguse.opentracks'

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            crunchPngs = false
            minifyEnabled = false
        }
    }


    flavorDimensions 'version'
    productFlavors {
        nightly {
            dimension 'version'
            applicationId 'com.fox.runner.nightly'

            base.archivesName = "runner-gardenia-nightly_${releaseVersion.VERSION_NAME}_${releaseVersion.VERSION_CODE}"

            signingConfig = signingConfigs.nightly
        }
        irreproducible {
            dimension 'version'
            applicationId 'com.fox.runner'
            versionNameSuffix 'irreproducible'
        }
        reproducible {
            dimension 'version'
            applicationId 'com.fox.runner'

            base.archivesName = "runner-gardenia_${releaseVersion.VERSION_NAME}_${releaseVersion.VERSION_CODE}"

            signingConfig = signingConfigs.release
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.core:core-location-altitude:1.0.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
                new com.android.build.api.variant.impl.ResValueKeyImpl("string", "applicationId"),
                new com.android.build.api.variant.ResValue(variant.applicationId.get(), null)
        )
    }
}
