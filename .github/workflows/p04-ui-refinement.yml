name: P0.3 native visual refinement
on:
  push:
    branches: [feature/theme-system-p0-3-ui-refinement]
    paths-ignore: ['docs/**','AGENTS.md']
permissions:
  contents: read
concurrency:
  group: p04-native-refinement
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  TZ: Asia/Singapore
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  scope:
    if: github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06' && github.ref == 'refs/heads/feature/theme-system-p0-3-ui-refinement'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      source: ${{ steps.route.outputs.source }}
      test-run: ${{ steps.route.outputs.test-run }}
      reports-artifact: ${{ steps.route.outputs.reports-artifact }}
      formal-artifact: ${{ steps.route.outputs.formal-artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_pipeline.py scope
  checks:
    needs: scope
    if: needs.scope.outputs.mode == 'checks' && github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06' && github.ref == 'refs/heads/feature/theme-system-p0-3-ui-refinement'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      signed: ${{ steps.plan.outputs.signed }}
    steps:
      - run: |
          sudo timedatectl set-timezone Asia/Singapore
          test "$(timedatectl show --property=Timezone --value)" = Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pipeline helper regression
        run: python3 -m unittest discover -s .github/tests -v -b
      - name: Native theme source and completed Phase 1 gate
        run: |
          python3 .github/scripts/check_p03_theme_source.py
          python3 .github/scripts/check_p04_source.py
      - name: Verify isolated branch and exact stage plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_pipeline.py prepare
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify JVM timezone
        run: |
          java -XshowSettings:properties -version 2>&1 | tee "$RUNNER_TEMP/java-timezone.txt"
          grep -F 'user.timezone = Asia/Singapore' "$RUNNER_TEMP/java-timezone.txt"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Debug build, lint, all JVM tests and instrumentation compilation
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleReproducibleDebug compileReproducibleDebugAndroidTestJavaWithJavac lintReproducibleDebug testReproducibleDebugUnitTest
      - name: Merge and audit the actual P0 Release manifest without signing
        if: steps.plan.outputs.stage == '8' || steps.plan.outputs.full == 'true'
        run: |
          ./gradlew --no-daemon --no-configuration-cache processReproducibleReleaseManifest
          python3 .github/scripts/verify_p0_offline.py
      - name: API35 stage instrumentation
        env:
          TEST_CLASSES: ${{ steps.plan.outputs.classes }}
        run: |
          args=()
          if [[ -n "$TEST_CLASSES" ]]; then args+=("-Pandroid.testInstrumentationRunnerArguments.class=$TEST_CLASSES"); fi
          mkdir -p build/reports/p0-diagnostics
          # Capture the live device while Gradle owns it; cancellation may remove the
          # managed device before an always() step can retrieve its diagnostic output.
          (
            while true; do
              sleep 30
              timeout 10s adb devices -l > build/reports/p0-diagnostics/devices.txt 2>&1 || true
              if timeout 15s adb logcat -d -v threadtime > build/reports/p0-diagnostics/logcat-next.txt 2>&1; then
                mv build/reports/p0-diagnostics/logcat-next.txt build/reports/p0-diagnostics/logcat.txt
              fi
              if timeout 10s adb shell dumpsys activity activities > build/reports/p0-diagnostics/activities-next.txt 2>&1; then
                mv build/reports/p0-diagnostics/activities-next.txt build/reports/p0-diagnostics/activities.txt
              fi
              {
                date -u --iso-8601=seconds
                awk '/MemAvailable|SwapFree/ {print}' /proc/meminfo
                df -h / /tmp
                ps -eo pid,rss,comm | awk '/qemu|emulator/ {print}'
              } >> build/reports/p0-diagnostics/host-health.txt
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          # A hung test fails rather than holding the shared instrument process forever.
          # The XML completeness gate still requires every configured test to execute.
          timeout --signal=INT --kill-after=30s 30m ./gradlew --no-daemon --no-configuration-cache --info --stacktrace mediumPhoneReproducibleDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect -Pandroid.testInstrumentationRunnerArguments.timezone=Asia/Singapore "-Pandroid.testInstrumentationRunnerArguments.buildCommit=$GITHUB_SHA" -Pandroid.testInstrumentationRunnerArguments.timeout_msec=1200000 "${args[@]}"
      - name: Preserve host emulator failure diagnostics
        if: always()
        run: |
          mkdir -p build/reports/p0-diagnostics
          sudo dmesg --ctime | tail -250 | grep -Ei 'out of memory|killed process|oom|qemu|segfault' > build/reports/p0-diagnostics/host-kernel.txt || true
          adb devices -l > build/reports/p0-diagnostics/final-devices.txt 2>&1 || true
          find /tmp/android-runner -maxdepth 2 -type f -name '*.dmp' -printf '%f %s bytes\n' > build/reports/p0-diagnostics/emulator-crash-files.txt 2>/dev/null || true
      - name: Validate actual Android GPX files against offline GPX 1.1 schema
        if: always() && (steps.plan.outputs.stage == '7' || steps.plan.outputs.stage == '8' || steps.plan.outputs.full == 'true')
        run: python3 .github/scripts/verify_p0_gpx.py
      - name: File database survives force-stop and a new instrumentation process
        if: steps.plan.outputs.stage == '6' || steps.plan.outputs.full == 'true'
        run: |
          ./gradlew --no-daemon --no-configuration-cache assembleReproducibleDebugAndroidTest -Pp0DurabilityRunner=true
          python3 .github/scripts/p0_durability.py
      - name: Require complete upstream UI regression evidence
        if: always() && steps.plan.outputs.full == 'true'
        run: python3 .github/scripts/collect_heart_rate_ui.py
      - name: Require actual Android/JVM stage reports and P0 screenshots
        if: always()
        run: python3 .github/scripts/p04_pipeline.py gate
      - name: Preserve compact native theme evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P04-visual-evidence-${{ github.run_id }}
          path: build/reports/p04-visual/
          if-no-files-found: error
          retention-days: 90
      - name: Verify Debug APK identity
        run: python3 .github/scripts/verify_debug_apk.py
      - name: Recheck protected original refs
        run: python3 .github/scripts/p04_pipeline.py refs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: P04-Debug-${{ github.run_id }}
          path: build/outputs/apk/reproducible/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: P04-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            build/outputs/androidTest-results/
            release-plan.json
          if-no-files-found: error
          retention-days: 90



  native-window-helper:
    needs: scope
    if: needs.scope.outputs.mode == 'checks' && github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06' && github.ref == 'refs/heads/feature/theme-system-p0-3-ui-refinement'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
      - name: API35 real native window helper self-test
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 .github/scripts/check_native_window.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: P04-native-window-helper-${{ github.run_id }}
          path: build/reports/native-window-helper
          if-no-files-found: error
          retention-days: 90


  signed:
    needs: scope
    if: needs.scope.outputs.mode == 'sign'
    environment: android-release
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P04_CONTEXT: ${{ runner.temp }}/p04-context.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual reviewed source and full test run to signing activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_signing.py context
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.scope.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify immutable full test evidence, without altering workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_signing.py inputs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Reuse a same-run accepted APK or preserved signed candidate on retry
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_signing.py existing
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.existing.outputs.formal-id != '' || steps.existing.outputs.candidate-id != ''
        with:
          artifact-ids: ${{ steps.existing.outputs.formal-id || steps.existing.outputs.candidate-id }}
          path: dist
          merge-multiple: true
      - name: Build reviewed source with original fixed key, shrink, align and verify
        if: steps.existing.outputs.formal-id == '' && steps.existing.outputs.candidate-id == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/runner-gardenia-p0-signing/release.jks"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_FILE")"
          trap 'rm -rf "$RUNNER_TEMP/runner-gardenia-p0-signing"; rm -f "$RUNNER_TEMP/p04-release-gradle.log"' EXIT
          python3 .github/scripts/restore_keystore.py
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean assembleReproducibleRelease | tee "$RUNNER_TEMP/p04-release-gradle.log"
          python3 .github/scripts/p04_signing.py verify
      - name: Always remove temporary fixed-key files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/runner-gardenia-p0-signing"
          rm -f "$RUNNER_TEMP/p04-release-gradle.log"
      - name: Preserve exact signed bytes before emulator acceptance, so retries never sign again
        if: steps.existing.outputs.formal-id == '' && steps.existing.outputs.candidate-id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RunnerGardenia-P04-Candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Download preserved P0.3 for actual retained-data upgrade
        if: steps.existing.outputs.formal-id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/p0-baseline"
          gh release download test-p0-v0.1.0-p0.3 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/p0-baseline" --pattern 'RunnerGardenia-P0-Release.apk' --pattern 'build-info.json' --pattern 'SHA256SUMS'
      - name: API35 signed install, real GPS inputs, recording recovery, upgrade and eight native schemes
        if: steps.existing.outputs.formal-id == ''
        env:
          P0_BASELINE_DIR: ${{ runner.temp }}/p0-baseline
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 .github/scripts/p04_release_smoke.py
      - name: Verify accepted fixed-key APK, original full reports, native focused pages and upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_signing.py bundle
      - name: Preserve formal accepted binary; publication waits for signed screenshot review
        if: steps.existing.outputs.formal-id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RunnerGardenia-P04-Release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original optimization, install and UI diagnostic records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P04-Release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/
            build/outputs/mapping/reproducibleRelease/
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: scope
    if: needs.scope.outputs.mode == 'publish'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P04_CONTEXT: ${{ runner.temp }}/p04-context.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind accepted APK and signed native visual review to publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_signing.py context
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.scope.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify immutable APK and all draft assets, publish unique pre-release, re-download anonymously
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p04_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: P04-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/publication.json
            dist/test-summary.json
            dist/RELEASE_NOTES.md
          if-no-files-found: warn
          retention-days: 90
