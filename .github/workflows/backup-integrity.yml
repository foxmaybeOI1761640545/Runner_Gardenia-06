name: Project backup integrity
on:
  push:
    branches: [feature/p0-2-gps-ui]
    paths:
      - 'docs/reports/**'
      - 'tools/verify_backup_inventory.py'
      - 'tools/check_workspace_sync.py'
      - '.github/tests/test_backup_inventory.py'
      - '.github/tests/test_workspace_sync.py'
      - '.github/workflows/backup-integrity.yml'
  pull_request:
    branches: [feature/p0-2-gps-ui]
    paths:
      - 'docs/reports/**'
      - 'tools/**'
      - '.github/tests/test_backup_inventory.py'
      - '.github/tests/test_workspace_sync.py'
      - '.github/workflows/backup-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/p0-2-gps-ui')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified existing v4 pin
        with:
          persist-credentials: false
      - name: Backup validator regression including tamper and traversal rejection
        run: python3 -B -m unittest discover -s .github/tests -p 'test_backup_inventory.py' -v
      - name: Verify every inventoried original byte
        run: python3 -B tools/verify_backup_inventory.py
