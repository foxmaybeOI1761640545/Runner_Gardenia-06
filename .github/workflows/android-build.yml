name: Android build and pre-release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One main publication at a time. Never cancel a run midway through tagging/uploading.
concurrency:
  group: android-${{ github.ref == 'refs/heads/main' && 'main-publication' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Singapore
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  prepare:
    name: Allocate immutable version plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publishing: ${{ steps.plan.outputs.publishing }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - run: sudo timedatectl set-timezone Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pipeline helper regression tests
        run: python3 -m unittest discover -s .github/tests -v -b
      - name: Allocate or resume this run's exact version
        id: plan
        run: python3 .github/scripts/release_policy.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: version-plan-${{ github.run_id }}
          path: release-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  checks:
    name: Debug build, lint and API 35 tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - run: |
          sudo timedatectl set-timezone Asia/Singapore
          test "$(timedatectl show --property=Timezone --value)" = Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: version-plan-${{ github.run_id }}
      - run: python3 .github/scripts/release_policy.py apply
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle JVM timezone
        run: |
          java -XshowSettings:properties -version 2>&1 | tee "$RUNNER_TEMP/java-timezone.txt"
          grep -F 'user.timezone = Asia/Singapore' "$RUNNER_TEMP/java-timezone.txt"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Debug APK, lint and unit tests
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleReproducibleDebug lintReproducibleDebug testReproducibleDebugUnitTest
      - name: Existing Android instrumentation tests (API 35)
        run: ./gradlew --no-daemon --no-configuration-cache mediumPhoneReproducibleDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect -Pandroid.testInstrumentationRunnerArguments.timezone=Asia/Singapore
      - name: Require actual heart-rate UI screenshots
        if: always()
        run: python3 .github/scripts/collect_heart_rate_ui.py
      - name: Require complete instrumentation XML and timezone evidence
        if: always()
        run: python3 .github/scripts/check_test_results.py
      - name: Verify actual Debug APK identity
        run: python3 .github/scripts/verify_debug_apk.py
      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk-${{ github.run_id }}
          path: build/outputs/apk/reproducible/debug/*.apk
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Export passed gate for tag job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gate-${{ github.run_id }}
          path: build/reports/ci-validation/instrumentation.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            build/outputs/androidTest-results/
          overwrite: true
          retention-days: 30

  create-tag:
    name: Tag the exact tested commit
    needs: [prepare, checks]
    if: >-
      needs.prepare.outputs.publishing == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - run: sudo timedatectl set-timezone Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: version-plan-${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-gate-${{ github.run_id }}
          path: gate
      - name: Create or safely reuse this run's immutable tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/release_policy.py tag

  signed:
    name: Fixed-key release APK
    needs: [prepare, checks, create-tag]
    if: >-
      needs.prepare.outputs.publishing == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - run: sudo timedatectl set-timezone Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: version-plan-${{ github.run_id }}
      - run: |
          python3 .github/scripts/release_policy.py apply
          python3 .github/scripts/release_policy.py verify-tag
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Restore key, build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/runner-gardenia-signing/release.jks"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_FILE")"
          trap 'rm -rf "$RUNNER_TEMP/runner-gardenia-signing"' EXIT
          python3 .github/scripts/restore_keystore.py
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean assembleReproducibleRelease
          python3 .github/scripts/verify_apk.py
      - name: Always remove temporary key
        if: always()
        run: rm -rf "$RUNNER_TEMP/runner-gardenia-signing"
      - name: Upload verified release files only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/build-info.json
            dist/release-notes.md
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish or resume verified pre-release
    needs: [prepare, signed]
    if: >-
      needs.prepare.outputs.publishing == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - run: sudo timedatectl set-timezone Asia/Singapore
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: dist
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify assets and safely publish or resume pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_release.py
      - name: Publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-${{ github.run_id }}
          path: dist/publication.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
