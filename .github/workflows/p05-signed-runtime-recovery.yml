name: P0.5 immutable signed runtime recovery
on:
  push:
    branches: [feature/p0-5-dashboard-settings-history]
    paths-ignore: ['docs/**', 'AGENTS.md']
permissions:
  contents: read
concurrency:
  group: p05-signed-runtime-recovery
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  TZ: Asia/Singapore
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  signed:
    if: github.repository == 'foxmaybeOI1761640545/Runner_Gardenia-06' && github.ref == 'refs/heads/feature/p0-5-dashboard-settings-history' && contains(github.event.head_commit.message, '[p05-recover-accepted-apk]')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute complete recovery helper suite
        run: python3 .github/scripts/p05_pipeline.py helpers
      - name: Bind actual reviewed source and full test run to signing activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/p05_runtime_recovery.py context
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c5093ed3ac9514b6655afb5ed022024d8776f6cb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;default;x86_64'
      - name: Download and verify immutable full test evidence, without altering workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/p05-runtime-recovery/p05_runtime_recovery.py" inputs
      - name: Download original P0.4 for actual retained-data upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/p0-baseline"
          gh release download test-p0-v0.1.0-p0.4 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/p0-baseline" --pattern 'RunnerGardenia-P0-Release.apk' --pattern 'build-info.json' --pattern 'SHA256SUMS'
      - name: Revalidate byte-identical fixed-key APK, upgrade, GPS, recovery and 80 native pages
        env:
          GH_TOKEN: ${{ github.token }}
          P0_BASELINE_DIR: ${{ runner.temp }}/p0-baseline
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 "$RUNNER_TEMP/p05-runtime-recovery/p05_runtime_recovery.py" smoke
      - name: Freeze and verify all exact accepted payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/p05-runtime-recovery/p05_runtime_recovery.py" finalize
      - name: Preserve formal immutable APK after successful runtime acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RunnerGardenia-P05-Release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve actual recovery diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P05-Recovery-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 90
